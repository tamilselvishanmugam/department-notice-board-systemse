<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Department Notice Board System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <span class="brand-icon">📌</span>
      <div>
        <h1>Department Notice Board</h1>
        <p class="tagline">Stay updated with department announcements</p>
      </div>
    </div>
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="admin.html">Admin Login</a>
    </nav>
  </header>

  <main class="container">

    <section class="filter-bar">
      <div class="field">
        <label for="deptFilter">Department</label>
        <select id="deptFilter">
          <option value="all">All Departments</option>
          <option value="CSE">Computer Science (CSE)</option>
          <option value="ECE">Electronics (ECE)</option>
          <option value="EEE">Electrical (EEE)</option>
          <option value="MECH">Mechanical (MECH)</option>
          <option value="CIVIL">Civil</option>
          <option value="IT">Information Technology (IT)</option>
          <option value="GENERAL">General / All Depts</option>
        </select>
      </div>

      <div class="field">
        <label for="priorityFilter">Priority</label>
        <select id="priorityFilter">
          <option value="all">All</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
      </div>

      <div class="field grow">
        <label for="searchBox">Search</label>
        <input type="text" id="searchBox" placeholder="Search by title or keyword...">
      </div>
    </section>

    <section id="stats" class="stats"></section>

    <section id="noticeList" class="notice-grid">
      <!-- Notices injected by JS -->
    </section>

    <p id="emptyState" class="empty-state" style="display:none;">No notices found for the selected filters.</p>

  </main>

  <footer>
    <p>&copy; <span id="year"></span> Department Notice Board System</p>
  </footer>

  <!-- Notice detail modal -->
  <div id="noticeModal" class="modal hidden">
    <div class="modal-box">
      <button id="closeModal" class="close-btn">&times;</button>
      <span id="modalDept" class="badge"></span>
      <h2 id="modalTitle"></h2>
      <p id="modalMeta" class="meta"></p>
      <p id="modalContent" class="content"></p>
      <a id="modalAttachment" href="#" target="_blank" style="display:none;">📎 View Attachment</a>
    </div>
  </div>

<script src="js/app.js"></script>
</body>
</html>
